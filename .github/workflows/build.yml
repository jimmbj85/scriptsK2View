name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022      # explícito en vez de "latest"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl python-pptx matplotlib

      - name: Construir EXE
        run: |
          pyinstaller --onefile --clean generarDashboardMes.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: generarDashboardMes
          path: dist/generarDashboardMes.exe
          retention-days: 7
