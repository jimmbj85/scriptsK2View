name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl xlsxwriter pyinstaller

      - name: Compilar EXE con PyInstaller
        run: |
          pyinstaller --onefile --name generarDashboardAnio generarDashboardAnio.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: generarDashboardAnio
          path: dist/generarDashboardAnio.exe
          retention-days: 30
