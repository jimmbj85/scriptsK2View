name: Compilar Dashboard Local a EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python en la máquina virtual
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías y PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl playwright pyinstaller

    - name: Compilar el script a un único archivo .EXE
      run: |
        pyinstaller --onefile --hidden-import=playwright.cli.main dashboard_local_mensual.py

    - name: Subir el ejecutable terminado a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Generador_Dashboards_Local
        path: dist/dashboard_local_mensual.exe
